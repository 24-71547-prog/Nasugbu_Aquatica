<!doctype html>
<!-- Inventory management page for searching and reviewing fish and product stock levels. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Fish Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body data-page="inventory">
  <div class="app-shell">
    <aside class="sidebar p-3" id="appSidebar">
      <div class="brand d-flex justify-content-between align-items-center pb-3 mb-3">
        <div>
          <h5 class="mb-0 text-white">Nasugbu Aquatica</h5>
          <small class="text-info">Management & IoT System</small>
        </div>
        <button class="btn btn-sm btn-outline-light d-lg-none" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
      </div>
      <nav class="nav flex-column">
        <a class="nav-link" data-nav="dashboard" href="dashboard.html"><i class="bi bi-grid-1x2 me-2"></i>Dashboard</a>
        <a class="nav-link" data-nav="iot" href="iot.html"><i class="bi bi-broadcast me-2"></i>IoT Monitoring</a>
        <a class="nav-link" data-nav="inventory" href="inventory.html"><i class="bi bi-box-seam me-2"></i>Live Fish Inventory</a>
        <a class="nav-link" data-nav="inventory" href="inventory.html"><i class="bi bi-bag-check me-2"></i>Fish & Product Management</a>
        <a class="nav-link" data-nav="purchases" href="purchases.html"><i class="bi bi-cart-plus me-2"></i>Purchases</a>
        <a class="nav-link" data-nav="sales" href="sales.html"><i class="bi bi-currency-exchange me-2"></i>Sales</a>
        <a class="nav-link" data-nav="packages" href="packages.html"><i class="bi bi-box2-heart me-2"></i>Packages / Bundles</a>
        <a class="nav-link" data-nav="stock-alerts" href="stock-alerts.html"><i class="bi bi-exclamation-triangle me-2"></i>Stock Alerts</a>
        <a class="nav-link" data-nav="reports" href="reports.html"><i class="bi bi-bar-chart-line me-2"></i>Reports</a>
        <a class="nav-link" data-nav="settings" href="#"><i class="bi bi-gear me-2"></i>Settings</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar p-3 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
          <h5 class="mb-0">Live Fish Inventory</h5>
        </div>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-light position-relative">
            <i class="bi bi-bell"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger stock-alert-count">0</span>
          </button>
          <div class="dropdown">
            <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-person-circle me-1"></i>Owner</button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#">Profile</a></li>
              <li><a class="dropdown-item" href="#">Preferences</a></li>
            </ul>
          </div>
        </div>
      </header>
      <div class="p-3 p-lg-4">
<div class="card p-3 mb-3">
  <div class="row g-2 align-items-end">
    <div class="col-md-4"><label class="form-label">Search</label><input id="inventorySearch" class="form-control" placeholder="Search fish/product" /></div>
    <div class="col-md-3"><label class="form-label">Category</label><select id="inventoryCategory" class="form-select"><option value="all">All</option><option>Live Fish</option><option>Fingerlings</option><option>Supplies</option><option>Accessories</option></select></div>
    <div class="col-md-3"><label class="form-label">Stock Status</label><select id="inventoryStatus" class="form-select"><option value="all">All</option><option>In Stock</option><option>Low Stock</option><option>Out of Stock</option></select></div>
    <div class="col-md-2"><button class="btn btn-primary w-100" data-mock-action="Add Inventory">Add Inventory</button></div>
  </div>
</div>
<div class="card p-3">
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead><tr><th>Fish/Product</th><th>Category</th><th>Quantity</th><th>Unit</th><th>Status</th><th>Last Updated</th><th>Actions</th></tr></thead>
      <tbody id="inventoryRows"></tbody>
    </table>
  </div>
</div>
</div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/iot.js"></script>
</body>
</html>
